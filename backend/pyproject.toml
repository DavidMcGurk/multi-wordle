[project]
name = "multi-wordle-backend"
version = "0.1.0"
description = "FastAPI backend for the Multi Wordle game"
readme = "README.md"
authors = [
    { name = "David McGurk", email = "David.McGurk0@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0,<4.0",
    "python-dotenv>=1.0.0",
    "wordfreq>=3.1.1",
]

[project.scripts]
multi-wordle = "backend.main:app"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "backend"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.10.3,<0.13.0"]
build-backend = "uv_build"
